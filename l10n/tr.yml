cli_ln2: |
 phpMussel programını kullandığınız için teşekkür ederiz; Sisteminize
 yüklenen dosyalardaki truva atlarını, virüsleri, zararlı yazılımları ve
 diğer tehditleri tespit etmek için tasarlanmış bir PHP betiği, ClamAV
 imzalarına ve diğerlerine dayalı olarak.
                                     ~ ~ ~
 PHPMUSSEL TELIF HAKKI 2013 ve sonrası GNU/GPLv2 by Caleb M (Maikuolan).
                                     ~ ~ ~
cli_ln3: |
 Şu anda CLI modunda çalışan phpMussel (komut satırı arabirimi). Bir
 dosyayı veya dizini taramak için "scan" yazın, taramak istediğiniz
 dosyanın veya dizinin adını yazın ve Enter tuşuna basın; CLI modu
 komutlarının bir listesi için "c" yazın ve Enter tuşuna basın; Çıkmak için
 "q" yazın ve Enter tuşuna basın.
%s is not a file or directory: "%s bir dosya veya dizin değil."
Entropy: "Entropi:"
Filename: "Dosya adı:"
I don_t understand that command, sorry: "Bu komutu anlamıyorum, üzgünüm."
In progress: "Devam etmekte"
Invalid URL: "Geçersiz URL!"
Last modified: "Son değiştirilme tarihi:"
Not a valid PE file: "Geçerli bir PE dosyası değil!"
PE Sections: "PE Bölümleri:"
Specified algorithm isn_t supported: "Belirtilen algoritma desteklenmiyor."
YOUR SIGNATURE NAME: "IMZA-ADINIZ"
cli_commands: |
 q | quit | exit — CLI'den çıkın.

 hash_file:[algo] [dosya adı] — Dosyalardan karma imzaları oluştur.

 hash:[algo] [dizgesi] — Dizeden karma imzası üret.
 Örnek: >> hash:crc32b Hello World
        4a17b156:11:IMZA-ADINIZ

 a | algo — Tüm desteklenen algoritmaları listele.

 hex_encode [dizgesi] — İkili dizgeyi onaltılık olarak dönüştür.
 Örnek: >> hex_encode Hello World
        48656c6c6f20576f726c64

 hex_decode [dizgesi] — Onaltılıyı ikili dizeye olarak dönüştür.

 (b | base64_encode) [dizgesi] — İkili'e base64 hale dönüştür.

 base64_decode [dizgesi] — Base64'ü ikili hale dönüştür.

 pe_meta [dosya adı] — Meta verileri bir PE dosyasından ayıklayın.

 (u | url_sig) [dizgesi] — URL tarayıcı imzalarını oluştur.

 (s | scan) [dosya veya dizinin adı] — Bir dosyayı veya dizini tarayın.

 (s | scan) [dosya veya dizinin adı] --xx
 — Ek bir seçenekle bir dosyayı veya dizini tarayın.
   --wc — Sonuçları önbelleğe almadan tarayın.
   --sf — Switch dosyası tarafından ayarlanan değişkenleri yazdır.

 i [dosya veya dizinin adı] — Dosyalar hakkında bilgi edinin.

 c — Bu komut listesini yazdırın.
