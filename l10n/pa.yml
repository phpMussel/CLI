cli_ln2: |
 phpMussel ਦੀ ਵਰਤੋਂ ਕਰਨ ਲਈ ਧੰਨਵਾਦ। phpMussel ਇੱਕ PHP ਸਕ੍ਰਿਪਟ ਹੈ ਜੋ ਤੁਹਾਡੇ
 ਸਿਸਟਮ ਤੇ ਅੱਪਲੋਡ ਕੀਤੀਆਂ ਫਾਈਲਾਂ ਵਿੱਚ ਟਰੋਜਨ, ਵਾਇਰਸ, ਮਾਲਵੇਅਰ, ਅਤੇ ਹੋਰ ਖਤਰਿਆਂ
 ਦਾ ਪਤਾ ਲਗਾਉਣ ਲਈ ਤਿਆਰ ਕੀਤੀ ਗਈ ਹੈ, ClamAV ਅਤੇ ਹੋਰਾਂ ਦੇ ਦਸਤਖਤਾਂ ਦੇ ਆਧਾਰ 'ਤੇ।
                                     ~ ~ ~
 PHPMUSSEL ਕਾਪੀਰਾਈਟ 2013 ਅਤੇ ਇਸ ਤੋਂ ਅੱਗੇ GNU/GPLv2, Caleb M (Maikuolan) ਦੁਆਰਾ।
                                     ~ ~ ~
cli_ln3: |
 ਵਰਤਮਾਨ ਵਿੱਚ CLI ਮੋਡ (ਕਮਾਂਡ ਲਾਈਨ ਇੰਟਰਫੇਸ) ਵਿੱਚ phpMussel ਚੱਲ ਰਿਹਾ ਹੈ।
 ਕਿਸੇ ਫਾਈਲ ਜਾਂ ਡਾਇਰੈਕਟਰੀ ਨੂੰ ਸਕੈਨ ਕਰਨ ਲਈ, "scan" ਟਾਈਪ ਕਰੋ, ਉਸ ਤੋਂ ਬਾਅਦ ਉਸ
 ਫਾਈਲ ਜਾਂ ਡਾਇਰੈਕਟਰੀ ਦਾ ਨਾਮ ਦਿਓ ਜਿਸਨੂੰ ਤੁਸੀਂ phpMussel ਨੂੰ ਸਕੈਨ ਕਰਨ ਲਈ ਚਾਹੁੰਦੇ
 ਹੋ ਅਤੇ ਐਂਟਰ ਦਬਾਓ; CLI ਮੋਡ ਕਮਾਂਡਾਂ ਦੀ ਸੂਚੀ ਲਈ "c" ਟਾਈਪ ਕਰੋ ਅਤੇ ਐਂਟਰ ਦਬਾਓ;
 ਛੱਡੋ ਕਰਨ ਲਈ, "q" ਟਾਈਪ ਕਰੋ ਅਤੇ ਐਂਟਰ ਦਬਾਓ।
%s is not a file or directory: "%s ਇੱਕ ਫਾਈਲ ਜਾਂ ਡਾਇਰੈਕਟਰੀ ਨਹੀਂ ਹੈ।"
Entropy: "ਐਂਟਰੋਪੀ:"
Filename: "ਫਾਈਲ ਦਾ ਨਾਮ:"
I don_t understand that command, sorry: "ਮੈਨੂੰ ਉਹ ਹੁਕਮ ਸਮਝ ਨਹੀਂ ਆਇਆ, ਮਾਫ਼ ਕਰਨਾ।"
In progress: "ਤਰੱਕੀ ਹੋ ਰਹੀ ਹੈ"
Invalid URL: "ਅਵੈਧ URL!"
Not a valid PE file: "ਵੈਧ PE ਫਾਈਲ ਨਹੀਂ ਹੈ!"
PE Sections: "PE ਸੈਕਸ਼ਨ:"
Specified algorithm isn_t supported: "ਨਿਰਧਾਰਤ ਐਲਗੋਰਿਦਮ ਸਮਰਥਿਤ ਨਹੀਂ ਹੈ।"
YOUR SIGNATURE NAME: "ਤੁਹਾਡੇ-ਦਸਤਖਤ-ਦਾ-ਨਾਮ"
cli_commands: |
 q | quit | exit — CLI ਛੱਡੋ।

 hash_file:[ਐਲਗੋਰਿਦਮ] [ਫਾਈਲ ਦਾ ਨਾਮ] — ਫਾਈਲਾਂ ਤੋਂ ਹੈਸ਼ ਦਸਤਖਤ ਬਣਾਓ।

 hash:[ਐਲਗੋਰਿਦਮ] [ਸਟ੍ਰਿੰਗ] — ਸਟ੍ਰਿੰਗ ਤੋਂ ਹੈਸ਼ ਦਸਤਖਤ ਬਣਾਓ।
 ਉਦਾਹਰਨ: >> hash:crc32b Hello World
          4a17b156:11:ਤੁਹਾਡੇ-ਦਸਤਖਤ-ਦਾ-ਨਾਮ

 a | algo — ਸਾਰੇ ਸਮਰਥਿਤ ਐਲਗੋਰਿਦਮ ਦੀ ਸੂਚੀ ਬਣਾਓ।

 (x | hex_encode) [ਸਟ੍ਰਿੰਗ] — ਬਾਈਨਰੀ ਸਟ੍ਰਿੰਗ ਨੂੰ ਹੈਕਸਾਡੈਸੀਮਲ ਵਿੱਚ ਬਦਲੋ।
 ਉਦਾਹਰਨ: >> hex_encode Hello World
          48656c6c6f20576f726c64

 hex_decode [ਸਟ੍ਰਿੰਗ] — ਹੈਕਸਾਡੈਸੀਮਲ ਨੂੰ ਬਾਈਨਰੀ ਸਟ੍ਰਿੰਗ ਵਿੱਚ ਬਦਲੋ।

 (b | base64_encode) [ਸਟ੍ਰਿੰਗ]
 — ਬਾਈਨਰੀ ਸਟ੍ਰਿੰਗ ਨੂੰ ਬੇਸ 64 ਸਟ੍ਰਿੰਗ ਵਿੱਚ ਬਦਲੋ।

 base64_decode [ਸਟ੍ਰਿੰਗ] — ਬੇਸ 64 ਸਟ੍ਰਿੰਗ ਨੂੰ ਬਾਈਨਰੀ ਸਟ੍ਰਿੰਗ ਵਿੱਚ ਬਦਲੋ।

 pe_meta [filename] — ਇੱਕ PE ਫਾਈਲ ਤੋਂ ਮੈਟਾਡੇਟਾ ਐਕਸਟਰੈਕਟ ਕਰੋ।

 (u | url_sig) [ਸਟ੍ਰਿੰਗ] — URL ਸਕੈਨਰ ਦਸਤਖਤ ਬਣਾਓ।

 (s | scan) [ਫਾਈਲ ਜਾਂ ਡਾਇਰੈਕਟਰੀ ਦਾ ਨਾਮ]
 — ਇੱਕ ਫਾਈਲ ਜਾਂ ਡਾਇਰੈਕਟਰੀ ਨੂੰ ਸਕੈਨ ਕਰੋ।

 (s | scan) [ਫਾਈਲ ਜਾਂ ਡਾਇਰੈਕਟਰੀ ਦਾ ਨਾਮ] --xx
 — ਇੱਕ ਵਾਧੂ ਵਿਕਲਪ ਨਾਲ ਇੱਕ ਫਾਈਲ ਜਾਂ ਡਾਇਰੈਕਟਰੀ ਨੂੰ ਸਕੈਨ ਕਰੋ।
   --wc — ਨਤੀਜਿਆਂ ਨੂੰ ਕੈਸ਼ ਕੀਤੇ ਬਿਨਾਂ ਸਕੈਨ ਕਰੋ।
   --sf — ਸਵਿੱਚ ਫਾਈਲ ਦੁਆਰਾ ਸੈੱਟ ਕੀਤੇ ਵੇਰੀਏਬਲ ਪ੍ਰਿੰਟ ਕਰੋ।

 i [ਫਾਈਲ ਜਾਂ ਡਾਇਰੈਕਟਰੀ ਦਾ ਨਾਮ] — ਫਾਈਲਾਂ ਬਾਰੇ ਜਾਣਕਾਰੀ ਪ੍ਰਾਪਤ ਕਰੋ।

 c — ਇਸ ਕਮਾਂਡ ਸੂਚੀ ਨੂੰ ਛਾਪੋ।
