cli_ln2: |
 ClamAV യുടെയും മറ്റുള്ളവരുടെയും ഒപ്പുകൾ അടിസ്ഥാനമാക്കി നിങ്ങളുടെ
 സിസ്റ്റത്തിലേക്ക് അപ്‌ലോഡ് ചെയ്‌തിരിക്കുന്ന ഫയലുകൾക്കുള്ളിലെ ട്രോജനുകൾ,
 വൈറസുകൾ, ക്ഷുദ്രവെയർ, മറ്റ് ഭീഷണികൾ എന്നിവ കണ്ടെത്തുന്നതിന് രൂപകൽപ്പന
 ചെയ്‌തിരിക്കുന്ന PHP സ്‌ക്രിപ്‌റ്റായ phpMussel ഉപയോഗിച്ചതിന് നന്ദി.
                                     ~ ~ ~
 PHPMUSSEL പകർപ്പവകാശം 2013 ഉം അതിനുശേഷവും Caleb M (Maikuolan) എഴുതിയ GNU/GPLv2.
                                     ~ ~ ~
cli_ln3: |
 നിലവിൽ phpMussel CLI മോഡിൽ (കമാൻഡ് ലൈൻ ഇന്റർഫേസ്) പ്രവർത്തിക്കുന്നു. ഒരു
 ഫയലോ ഡയറക്ടറിയോ സ്കാൻ ചെയ്യാൻ, "scan" എന്ന് ടൈപ്പ് ചെയ്യുക, തുടർന്ന്
 phpMussel സ്കാൻ ചെയ്യാൻ ആഗ്രഹിക്കുന്ന ഫയലിന്റെയോ ഡയറക്ടറിയുടെയോ പേര് നൽകി
 എന്റർ അമർത്തുക; CLI മോഡ് കമാൻഡുകളുടെ ഒരു പട്ടികയ്ക്കായി "c" ടൈപ്പ് ചെയ്ത്
 എന്റർ അമർത്തുക; പുറത്തുകടക്കാൻ "q" എന്ന് ടൈപ്പ് ചെയ്ത് എന്റർ അമർത്തുക.
%s is not a file or directory: "%s ഒരു ഫയലോ ഡയറക്ടറിയോ അല്ല."
Entropy: "എൻട്രോപ്പി:"
Filename: "ഫയലിന്റെ പേര്:"
I don_t understand that command, sorry: "ആ കമാൻഡ് എനിക്ക് മനസ്സിലാകുന്നില്ല, ക്ഷമിക്കണം."
In progress: "പുരോഗതിയിൽ"
Invalid URL: "സാധുവായ ഒരു URL അല്ല!"
Last modified: "അവസാനം പരിഷ്‌ക്കരിച്ചത്:"
Not a valid PE file: "സാധുവായ ഒരു PE ഫയൽ അല്ല!"
PE Sections: "PE വിഭാഗങ്ങൾ:"
Specified algorithm isn_t supported: "നിർദ്ദിഷ്ട അൽഗോരിതം പിന്തുണയ്ക്കുന്നില്ല."
YOUR SIGNATURE NAME: "നിങ്ങളുടെ-ഒപ്പ്-പേര്"
cli_commands: |
 q | quit | exit — CLI വിടുക.

 hash_file:[അൽഗോരിതം] [ഫയലിന്റെ പേര്] — ഫയലുകളിൽ നിന്ന് ഹാഷ് ഒപ്പുകൾ സൃഷ്ടിക്കുക.

 hash:[അൽഗോരിതം] [സ്ട്രിംഗ്] — സ്ട്രിംഗിൽ നിന്ന് ഹാഷ് ഒപ്പ് സൃഷ്ടിക്കുക.
 Example: >> hash:crc32b Hello World
          4a17b156:11:നിങ്ങളുടെ-ഒപ്പ്-പേര്

 a | algo — പിന്തുണയ്ക്കുന്ന എല്ലാ അൽഗോരിതങ്ങളും പട്ടികപ്പെടുത്തുക.

 (x | hex_encode) [സ്ട്രിംഗ്] — ബൈനറി സ്ട്രിംഗ് ഹെക്സാഡെസിമലിലേക്ക് പരിവർത്തനം ചെയ്യുക.
 Example: >> hex_encode Hello World
          48656c6c6f20576f726c64

 hex_decode [സ്ട്രിംഗ്] — ഹെക്സാഡെസിമലിനെ ബൈനറി സ്ട്രിംഗിലേക്ക് പരിവർത്തനം ചെയ്യുക.

 (b | base64_encode) [സ്ട്രിംഗ്] — ബൈനറി സ്ട്രിംഗ് ബേസ്64 സ്ട്രിംഗിലേക്ക് പരിവർത്തനം ചെയ്യുക.

 base64_decode [സ്ട്രിംഗ്] — ബേസ്64 സ്ട്രിംഗ് ബൈനറി സ്ട്രിംഗിലേക്ക് പരിവർത്തനം ചെയ്യുക.

 pe_meta [ഫയലിന്റെ പേര്] — ഒരു PE ഫയലിൽ നിന്ന് മെറ്റാഡാറ്റ എക്‌സ്‌ട്രാക്റ്റ് ചെയ്യുക.

 (u | url_sig) [സ്ട്രിംഗ്] — URL സ്കാനർ ഒപ്പുകൾ സൃഷ്ടിക്കുക.

 (s | scan) [ഫയലിന്റെയോ ഡയറക്ടറിയുടെയോ പേര്] — ഒരു ഫയലോ ഡയറക്ടറിയോ സ്കാൻ ചെയ്യുക.

 (s | scan) [ഫയലിന്റെയോ ഡയറക്ടറിയുടെയോ പേര്] --xx
 — ഒരു അധിക ഓപ്ഷൻ ഉപയോഗിച്ച് ഒരു ഫയലോ ഡയറക്ടറിയോ സ്കാൻ ചെയ്യുക.
   --wc — ഫലങ്ങൾ കാഷെ ചെയ്യാതെ സ്കാൻ ചെയ്യുക.
   --sf — സ്വിച്ച് ഫയൽ സജ്ജമാക്കിയ വേരിയബിളുകൾ പ്രിന്റ് ചെയ്യുക.

 i [ഫയലിന്റെയോ ഡയറക്ടറിയുടെയോ പേര്] — ഫയലുകളെക്കുറിച്ചുള്ള വിവരങ്ങൾ നേടുക.

 c — ഈ കമാൻഡുകളുടെ പട്ടിക പ്രിന്റ് ചെയ്യുക.
