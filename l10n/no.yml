cli_ln2: |
 Takk for at du bruker phpMussel, et PHP-skript designet for å oppdage
 trojanere, virus, malware og andre trusler i filer lastet opp til systemet
 ditt uansett hvor skriptet er koblet, basert på signaturene fra ClamAV og
 andre.
                                     ~ ~ ~
 PHPMUSSEL COPYRIGHT 2013 og utover GNU/GPLv2 av Caleb M (Maikuolan).
                                     ~ ~ ~
cli_ln3: |
 For tiden kjører phpMussel i CLI-modus (kommandolinjegrensesnitt). For å
 skanne en fil eller katalog, skriver du inn «scan», etterfulgt av navnet
 på filen eller katalogen du vil at phpMussel skal skanne og trykk Enter;
 Skriv inn «c» og trykk Enter for en liste over CLI-modus kommandoer; Skriv
 «q» og trykk Enter for å avslutte.
%s is not a file or directory: "%s er ikke en fil eller katalog."
Entropy: "Entropi:"
Filename: "Filnavn:"
I don_t understand that command, sorry: "Jeg forstår ikke den kommandoen, beklager."
In progress: "I prosess"
Invalid URL: "Ugyldig URL!"
Last modified: "Sist endret:"
Not a valid PE file: "Ikke en gyldig PE-fil!"
PE Sections: "PE-seksjoner:"
Specified algorithm isn_t supported: "Spesifisert algoritme støttes ikke."
YOUR SIGNATURE NAME: "DITT-SIGNATURNAVN"
cli_commands: |
 q | quit | exit — Avslutt CLI.

 hash_file:[algo] [navnet på filen] — Generer hashsignaturer fra filer.

 hash:[algo] [streng] — Generer hashsignatur fra streng.
 Eksempel: >> hash:crc32b Hello World
           4a17b156:11:DITT-SIGNATURNAVN

 a | algo — Liste over alle støttede algoritmer.

 hex_encode [streng] — Konverter binær streng til heksadesimal.
 Eksempel: >> hex_encode Hello World
           48656c6c6f20576f726c64

 hex_decode [streng] — Konverter heksadesimal til binær streng.

 (b | base64_encode) [streng] — Konverter binær streng til base64-streng.

 base64_decode [streng] — Konverter base64-streng til binær streng.

 pe_meta [navnet på filen] — Pakk ut metadata fra en PE-fil.

 (u | url_sig) [streng] — Generer URL-skannersignaturer.

 (s | scan) [navnet på filen eller katalogen] — Skann en fil eller katalog.

 (s | scan) [navnet på filen eller katalogen] --xx
 — Skann en fil eller katalog med et ekstra alternativ.
   --wc — Skann uten å bufre resultatene.
   --sf — Skriv ut variablene angitt av bryterfilen.

 i [navnet på filen eller katalogen] — Få informasjon om filer.

 c — Skriv ut denne kommandolisten.
