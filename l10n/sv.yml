cli_ln3: |
 Kör för närvarande phpMussel i CLI-läge (kommandoradsgränssnitt). Om du
 vill skanna en fil eller katalog, skriver du "scan", följt av namnet på
 filen eller katalogen som du vill att phpMussel ska skanna, och tryck på
 Enter; Skriv "c" och tryck på Enter för att visa en lista över
 CLI-läge-kommandon; Skriv "q" och tryck på Enter för att avsluta.
%s is not a file or directory: "%s är inte en fil eller katalog."
Entropy: "Entropi:"
Filename: "Filnamn:"
I don_t understand that command, sorry: "Jag förstår inte det kommandot, ursäkta."
In progress: "Pågående"
Invalid URL: "Felaktig URL!"
Not a valid PE file: "Inte en giltig PE-fil!"
PE Sections: "PE-sektion:"
Specified algorithm isn_t supported: "Specificerad algoritm stöds inte."
YOUR SIGNATURE NAME: "DITT-SIGNATURNAMN"
cli_commands: |
 q | quit | exit — Avsluta CLI.

 hash_file:[algo] [namn på filen] — Generera hash-signaturer från filer.

 hash:[algo] [sträng] — Generera hash-signaturer från strängen.
 Exempel: >> hash:crc32b Hello World
          4a17b156:11:DITT-SIGNATURNAMN

 a | algo — Lista alla algoritmer som stöds.

 hex_encode [sträng] — Konvertera binär sträng till hexadecimal.
 Exempel: >> hex_encode Hello World
          48656c6c6f20576f726c64

 hex_decode [sträng] — Konvertera hexadecimal till binär sträng.

 (b | base64_encode) [sträng] — Konvertera binär sträng till bas64-sträng.

 base64_decode [sträng] — Konvertera bas64-sträng till binär sträng.

 pe_meta [namn på filen] — Extrahera metadata från en PE-fil.

 (u | url_sig) [sträng] — Generera URL-skannersignaturer.

 (s | scan) [namnet på filen eller katalogen] — Skanna en fil eller katalog.

 (s | scan) [namnet på filen eller katalogen] --xx
 — Skanna en fil eller katalog med ett extra alternativ.
   --wc — Skanna utan att cachelagra resultaten.
   --sf — Skriv ut variablerna som ställts in av switchfilen.

 i [namnet på filen eller katalogen] — Få information om filer.

 c — Skriv ut den här kommandolistan.
