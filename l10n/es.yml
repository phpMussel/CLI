cli_ln2: |
 Gracias por usar phpMussel, un script PHP diseñado para detectar troyanos,
 virus, malware y otras amenazas en los archivos subidos al sistema dónde
 el script está adjunto, basado en las firmas de ClamAV y otros.
                                     ~ ~ ~
 PHPMUSSEL COPYRIGHT 2013 and beyond GNU/GPLv2 by Caleb M (Maikuolan).
                                     ~ ~ ~
cli_ln3: |
 Ud. está ejecutando phpMussel en modo CLI (interfaz de línea de comandos).
 Para escanear un archivo o directorio, escribir "scan", seguido por el
 nombre del archivo o directorio que usted desea que phpMussel escanee y
 pulse Enter; Escriba "c" y pulse Enter para obtener una lista de comandos;
 Escriba "q" y pulse Enter para salir.
%s is not a file or directory: "%s no es un archivo o directorio."
Entropy: "Entropía:"
Filename: "Nombre del archivo:"
I don_t understand that command, sorry: "No entiendo ese comando, lo siento."
In progress: "En operación"
Invalid URL: "¡URL no válido!"
Last modified: "Última modificación:"
Not a valid PE file: "¡No es un archivo PE válido!"
PE Sections: "Secciones PE:"
Specified algorithm isn_t supported: "El algoritmo especificado no es soportado."
YOUR SIGNATURE NAME: "NOMBRE-DE-FIRMA"
cli_commands: |
 q | quit | exit — Dejar CLI.

 hash_file:[algo] [nombre del archivo] — Generar firmas hash de archivos.

 hash:[algo] [string] — Generar firma hash de string.
 Ejemplo: >> hash:crc32b Hello World
          4a17b156:11:NOMBRE-DE-FIRMA

 a | algo — Lista todos los algoritmos soportados.

 (x | hex_encode) [string] — Convertir string binaria a hexadecimal.
 Ejemplo: >> hex_encode Hello World
          48656c6c6f20576f726c64

 hex_decode [string] — Convertir hexadecimal a string binaria.

 (b | base64_encode) [string] — Convertir string binaria a string base64.

 base64_decode [string] — Convertir string base64 a string binaria.

 pe_meta [nombre del archivo] — Extraer metadatos de un archivo PE.

 (u | url_sig) [string] — Generar firmas de escáner de URL.

 (s | scan) [nombre del archivo o directorio]
 — Escanear un archivo o directorio.

 (s | scan) [nombre del archivo o directorio] --xx
 — Escanear un archivo o directorio con una opción adicional.
   --wc — Escanear sin almacenar en caché los resultados.
   --sf — Imprima las variables establecidas por el archivo de conmutación.

 i [nombre del archivo o directorio]
 — Obtener información sobre los archivos.

 c — Imprimir esta lista de comandos.
