cli_ln2: |
 phpMussel वापरल्याबद्दल धन्यवाद. phpMussel ही एक PHP स्क्रिप्ट आहे जी
 तुमच्या सिस्टमवर अपलोड केलेल्या फायलींमध्ये ट्रोजन, व्हायरस, मालवेअर, आणि
 इतर धोके शोधण्यासाठी डिझाइन केलेली आहे. हे ClamAV आणि इतरांच्या
 स्वाक्षऱ्यांवर आधारित आहे.
                                     ~ ~ ~
 PHPMUSSEL कॉपीराइट 2013 आणि त्यानंतर GNU/GPLv2 by Caleb M (Maikuolan) द्वारे.
                                     ~ ~ ~
cli_ln3: |
 सध्या phpMussel CLI मोडमध्ये (कमांड लाइन इंटरफेस) चालवत आहे. फाइल किंवा
 निर्देशिका स्कॅन करण्यासाठी, "scan" टाइप करा, नंतर phpMussel ला ज्या फाइल
 किंवा निर्देशिकाला स्कॅन करायचे आहे त्याचे नाव टाइप करा आणि एंटर दाबा.
 CLI मोड कमांडची यादी पाहण्यासाठी "c" टाइप करा आणि एंटर दाबा; बाहेर
 पडण्यासाठी "q" टाइप करा आणि एंटर दाबा.
%s is not a file or directory: "%s ही फाइल किंवा निर्देशिका नाही."
Entropy: "एन्ट्रॉपी:"
Filename: "फाईलचे नाव:"
I don_t understand that command, sorry: "मला ती आज्ञा समजली नाही, माफ करा."
In progress: "प्रगतीपथावर आहे"
Invalid URL: "वैध URL नाही!"
Not a valid PE file: "वैध PE फाइल नाही!"
PE Sections: "PE विभाग:"
Specified algorithm isn_t supported: "निर्दिष्ट अल्गोरिदम समर्थित नाही."
YOUR SIGNATURE NAME: "तुमच्या-स्वाक्षरीचे-नाव"
cli_commands: |
 q | quit | exit — CLI सोडा.

 hash_file:[अल्गोरिदम] [फाइलनाव] — फायलींमधून हॅश स्वाक्षरी तयार करा.

 hash:[अल्गोरिदम] [स्ट्रिंग] — स्ट्रिंगमधून हॅश स्वाक्षरी जनरेट करा.
 Example: >> hash:crc32b Hello World
          4a17b156:11:तुमच्या-स्वाक्षरीचे-नाव

 a | algo — सर्व समर्थित अल्गोरिदमची यादी करा.

 (x | hex_encode) [स्ट्रिंग] — बायनरी स्ट्रिंग हेक्साडेसिमलमध्ये रूपांतरित करा.
 Example: >> hex_encode Hello World
          48656c6c6f20576f726c64

 hex_decode [स्ट्रिंग] — हेक्साडेसिमलला बायनरी स्ट्रिंगमध्ये रूपांतरित करा.

 (b | base64_encode) [स्ट्रिंग] — बायनरी स्ट्रिंगला बेस६४ स्ट्रिंगमध्ये रूपांतरित करा.

 base64_decode [स्ट्रिंग] — बेस६४ स्ट्रिंग बायनरी स्ट्रिंगमध्ये रूपांतरित करा.

 pe_meta [फाइलनाव] — PE फाईलमधून मेटाडेटा काढा.

 (u | url_sig) [स्ट्रिंग] — URL स्कॅनर स्वाक्षऱ्या तयार करा.

 (s | scan) [फाइल किंवा निर्देशिकेचे नाव] — फाइल किंवा निर्देशिका स्कॅन करा.

 (s | scan) [फाइल किंवा निर्देशिकेचे नाव] --xx
 — अतिरिक्त पर्याय वापरून फाइल किंवा निर्देशिका स्कॅन करा.
   --wc — निकाल कॅश न करता स्कॅन करा.
   --sf — स्विच फाईलने सेट केलेले व्हेरिएबल्स प्रिंट करा.

 i [फाइल किंवा निर्देशिकेचे नाव] — फायलींबद्दल माहिती मिळवा.

 c — ही कमांड लिस्ट प्रिंट करा.
