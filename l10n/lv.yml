cli_ln2: |
 Paldies, ka izmantojāt phpMussel, PHP skripts, pamatojoties uz ClamAV un
 citu parakstiem, kas paredzēts trojas zirgu, vīrusu, ļaunprātīgas
 programmatūras un citu draudu noteikšanai failos iekšpusē, kas
 augšupielādēti jūsu sistēmā, lai kur būtu savienots skripts.
                                     ~ ~ ~
 PHPMUSSEL COPYRIGHT 2013 un vēlāk GNU/GPLv2 izveidojis Caleb M (Maikuolan).
                                     ~ ~ ~
cli_ln3: |
 Pašlaik darbojas phpMussel CLI režīmā (komandrindas saskarne). Lai skenētu
 failu vai direktoriju, ierakstiet "scan", kam seko faila vai direktorija
 nosaukums, kuru vēlaties skenēt phpMussel, un nospiediet Enter; Ierakstiet
 "c" un nospiediet taustiņu Enter, lai atvērtu CLI režīma komandu sarakstu;
 Ierakstiet "q" un nospiediet Enter, lai izietu.
%s is not a file or directory: "%s nav fails vai direktorijs."
Entropy: "Entropija:"
Filename: "Faila nosaukums:"
I don_t understand that command, sorry: "Atvainojiet, es nesaprotu šo komandu."
In progress: "Darbs notiek"
Invalid URL: "Nederīgs URL!"
Not a valid PE file: "Nav derīgs PE fails."
PE Sections: "PE sekcijas:"
Specified algorithm isn_t supported: "Norādītais algoritms netiek atbalstīts."
YOUR SIGNATURE NAME: "JŪSU-PARAKSTA-VĀRDS"
cli_commands: |
 q | quit | exit — Iziet no CLI.

 hash_file:[algo] [faila nosaukums]
 — Ģenerējiet hash parakstus no failiem.

 hash:[algo] [virkne] — Ģenerējiet hash parakstu no virknes.
 Piemērs: >> hash:crc32b Hello World
          4a17b156:11:JŪSU-PARAKSTA-VĀRDS

 a | algo — Uzskaitiet visus atbalstītos algoritmus.

 hex_encode [virkne] — Konvertēt bināro virkni uz heksadecimālo.
 Piemērs: >> hex_encode Hello World
          48656c6c6f20576f726c64

 hex_decode [virkne] — Konvertēt heksadecimālo uz binārā virknē.

 (b | base64_encode) [virkne] — Konvertēt bināro virkni uz base64 virkni.

 base64_decode [virkne] — Konvertēt base64 virkni uz bināro virkni.

 pe_meta [faila nosaukums] — Ekstrahējiet metadatus no PE faila.

 (u | url_sig) [virkne] — Ģenerējiet URL skeneru parakstus.

 (s | scan) [faila vai direktorijas nosaukums]
 — Skenēt failu vai direktoriju.

 (s | scan) [faila vai direktorijas nosaukums] --xx
 — Skenēt failu vai direktoriju ar papildu opciju.
   --wc — Skenēt nesaglabājot rezultātus kešatmiņā.
   --sf — Izdrukājiet slēdža failā iestatītos mainīgos.

 i [faila vai direktorijas nosaukums] — Iegūstiet informāciju par failiem.

 c — Izdrukājiet šo komandu sarakstu.
