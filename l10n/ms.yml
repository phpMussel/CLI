cli_ln2: |
 Terima kasih untuk menggunakan phpMussel, skrip PHP direka untuk mengesan
 trojan, virus, perisian hasad, dan ancaman lain dalam fail dimuat naik ke
 sistem anda dimana sahaja skrip disambungkan, berdasarkan tandatangan dari
 ClamAV dan lain-lain.
                                     ~ ~ ~
 PHPMUSSEL HAK CIPTA 2013 dan seterusnya GNU/GPLv2 oleh Caleb M (Maikuolan).
                                     ~ ~ ~
cli_ln3: |
 Sedang menjalankan phpMussel dalam mod CLI (command line interface). Untuk
 mengimbas fail atau direktori, taip "scan", diikuti dengan nama fail atau
 direktori yang anda mahu phpMussel untuk mengimbas dan tekan Enter; Taip
 "c" dan tekan Enter untuk senarai arahan mod CLI; Taip "q" dan tekan Enter
 untuk berhenti.
%s is not a file or directory: "%s bukan fail atau direktori."
Entropy: "Entropi:"
Filename: "Nama fail:"
I don_t understand that command, sorry: "Saya tidak faham arahan ini, maaf."
In progress: "Sedang berlangsung"
Invalid URL: "URL tidak sah!"
Last modified: "Terakhir diubah:"
Not a valid PE file: "Bukan fail PE yang sah!"
PE Sections: "Bahagian PE:"
Specified algorithm isn_t supported: "Algoritma yang ditentukan tidak disokong."
YOUR SIGNATURE NAME: "NAMA-TANDATANGAN"
cli_commands: |
 q | quit | exit — Berhenti CLI.

 hash_file:[algo] [nama fail] — Hasilkan tandatangan hash daripada fail.

 hash:[algo] [string] — Hasilkan tandatangan hash daripada rentetan.
 Contoh: >> hash:crc32b Hello World
         4a17b156:11:NAMA-TANDATANGAN

 a | algo — Senaraikan semua algoritma yang disokong.

 (x | hex_encode) [string] — Tukar rentetan binari kepada perenambelasan.
 Contoh: >> hex_encode Hello World
         48656c6c6f20576f726c64

 hex_decode [string] — Tukar perenambelasan kepada rentetan binari.

 (b | base64_encode) [string]
 — Tukar rentetan binari kepada rentetan base64.

 base64_decode [string]
 — Tukar rentetan base64 kepada rentetan binari.

 pe_meta [nama fail] — Ekstrak metadata daripada fail PE.

 (u | url_sig) [string] — Hasilkan tandatangan pengimbas URL.

 (s | scan) [nama fail atau direktori]
 — Imbas fail atau direktori.

 (s | scan) [nama fail atau direktori] --xx
 — Imbas fail atau direktori dengan pilihan tambahan.
   --wc — Imbas tanpa menyimpan hasil imbasan.
   --sf — Cetak pembolehubah yang ditetapkan oleh fail suis.

 i [nama fail atau direktori] — Dapatkan maklumat tentang fail.

 c — Cetak senarai arahan ini.
