cli_ln2: |
 Grazie per aver scelto phpMussel, un programma in PHP progettato per
 rilevare trojan, virus, malware ed altre minacce nei file caricati sul suo
 sistama dovunque il programma stesso è collegato, basato sulle firme di
 ClamAV ed altri.
                                     ~ ~ ~
 PHPMUSSEL COPYRIGHT 2013 e oltre GNU/GPL V.2 Caleb M (Maikuolan).
                                     ~ ~ ~
cli_ln3: |
 Attualmente in esecuzione in modalità CLI (interfaccia a riga di
 comando). Per scansionare un file o una cartella digita "scan" seguito dal
 nome del file o della cartella e premi Invio; digita "c" e premi Invio per
 l'elenco dei comandi in modalità CLI; digita "q" e premi Invio per uscire.
%s is not a file or directory: "%s non è né un file né una cartella."
Entropy: "Entropia:"
Filename: "Nome del file:"
I don_t understand that command, sorry: "Non capisco quel comando, mi dispiace."
In progress: "In corso"
Invalid URL: "URL non valido!"
Last modified: "Ultima modifica:"
Not a valid PE file: "Non è un PE file valida!"
PE Sections: "PE Sezioni:"
Specified algorithm isn_t supported: "L'algoritmo specificato non è supportato."
YOUR SIGNATURE NAME: "NOME-DELLA-FIRMA"
cli_commands: |
 q | quit | exit — Esci dall'interfaccia a riga di comando.

 hash_file:[algo] [nome del file] — Genera le firme hash da file.

 hash:[algo] [stringa] — Genera le firme hash da stringa.
 Esempio: >> hash:crc32b Hello World
          4a17b156:11:NOME-DELLA-FIRMA

 a | algo — Elenca tutti gli algoritmi supportati.

 hex_encode [stringa] — Converti la stringa binaria in esadecimale.
 Esempio: >> hex_encode Hello World
          48656c6c6f20576f726c64

 hex_decode [stringa] — Converti la stringa esadecimale in binaria.

 (b | base64_encode) [stringa] — Converti la stringa binaria in base64.

 base64_decode [stringa] — Converti la stringa da base64 a binaria.

 pe_meta [nome del file] — Estrarre i metadati da un file PE.

 (u | url_sig) [stringa] — Genera firme di scanner URL.

 (s | scan) [nome del file o della cartella]
 — Scansiona un file o una cartella.

 (s | scan) [nome del file o della cartella] --xx
 — Scansiona un file o una cartella con un'opzione aggiuntiva.
   --wc — Esegui la scansione senza memorizzare i risultati nella cache.
   --sf — Mostra le variabili impostate dal file switch.

 i [nome del file o della cartella] — Ottieni informazioni sui file.

 c — Mostra questa lista di comandi.
