cli_ln2: |
 Dziękujemy za korzystanie z phpMussel, skrypt PHP przeznaczony do
 wykrywania trojanów, wirusów, złośliwego oprogramowania i innych zagrożeń
 w plikach przesyłanych do systemu, gdziekolwiek skrypt jest zaczepiony, na
 podstawie podpisów ClamAV i innych.
                                     ~ ~ ~
 PHPMUSSEL COPYRIGHT 2013 i późniejsze GNU/GPLv2 przez Caleb M (Maikuolan).
                                     ~ ~ ~
cli_ln3: |
 Obecnie uruchomiony phpMussel w trybie CLI (interfejs wiersza poleceń).
 Aby przeskanować plik lub katalog, wpisz „scan”, następnie nazwa pliku lub
 katalogu, który ma zostać przeskanowany przez phpMussel, i naciśnij Enter;
 Wpisz „c” i naciśnij klawisz Enter, aby wyświetlić listę poleceń trybu
 CLI; Wpisz „q” i naciśnij Enter, aby wyjść.
%s is not a file or directory: "%s nie jest plikiem ani katalogiem."
Entropy: "Entropia:"
Filename: "Nazwa pliku:"
I don_t understand that command, sorry: "Przepraszam, nie rozumiem tego polecenia."
In progress: "Praca w toku"
Invalid URL: "Niepoprawny URL!"
Not a valid PE file: "Nieprawidłowy plik PE!"
PE Sections: "Sekcje PE:"
Specified algorithm isn_t supported: "Określony algorytm nie jest obsługiwany."
YOUR SIGNATURE NAME: "TWOJE-NAZWA-PODPISY"
cli_commands: |
 q | quit | exit — Zamknij CLI.

 hash_file:[algo] [nazwa pliku] — Wygeneruj podpisy skrótów z plików.

 hash:[algo] [dane] — Wygeneruj signature hash z ciągu.
 Przykład: >> hash:crc32b Hello World
           4a17b156:11:TWOJE-NAZWA-PODPISY

 a | algo — Wyświetl wszystkie obsługiwane algorytmy.

 hex_encode [dane] — Konwertuj dane binarne na szesnastkowe.
 Przykład: >> hex_encode Hello World
           48656c6c6f20576f726c64

 hex_decode [dane] — Konwertuj dane szesnastkowe na binarne.

 (b | base64_encode) [dane] — Konwertuj dane binarne na dane base64.

 base64_decode [dane] — Konwertuj dane base64 na dane binarne.

 pe_meta [nazwa pliku] — Wyodrębnij metadane z pliku PE.

 (u | url_sig) [dane] — Wygeneruj podpisy skanera adresów URL.

 (s | scan) [nazwa pliku lub katalogu] — Zeskanuj plik lub katalog.

 (s | scan) [nazwa pliku lub katalogu] --xx
 — Zeskanuj plik lub katalog za pomocą dodatkowej opcji.
   --wc — Zeskanuj bez buforowania wyników.
   --sf — Wydrukuj zmienne ustawione przez plik przełącznika.

 i [nazwa pliku lub katalogu] — Uzyskaj informacje o plikach.

 c — Wydrukuj tę listę poleceń.
