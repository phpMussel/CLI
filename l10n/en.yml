cli_ln3: |
 Currently running phpMussel in CLI mode (command line interface). To scan
 a file or directory, type "scan", followed by the name of the file or
 directory that you want phpMussel to scan and press Enter; Type "c" and
 press Enter for a list of CLI mode commands; Type "q" and press Enter to
 quit.
%s is not a file or directory: "%s is not a file or directory."
Entropy: "Entropy:"
Filename: "Filename:"
I don_t understand that command, sorry: "I don't understand that command, sorry."
In progress: "In progress"
Invalid URL: "Invalid URL!"
Last modified: "Last modified:"
Not a valid PE file: "Not a valid PE file!"
PE Sections: "PE Sections:"
Specified algorithm isn_t supported: "Specified algorithm isn't supported."
YOUR SIGNATURE NAME: "YOUR-SIGNATURE-NAME"
cli_commands: |
 q | quit | exit — Quit CLI.

 hash_file:[algo] [filename] — Generate hash signatures from files.

 hash:[algo] [string] — Generate hash signature from string.
 Example: >> hash:crc32b Hello World
          4a17b156:11:YOUR-SIGNATURE-NAME

 a | algo — List all supported algorithms.

 (x | hex_encode) [string] — Convert binary string to hexadecimal.
 Example: >> hex_encode Hello World
          48656c6c6f20576f726c64

 hex_decode [string] — Convert hexadecimal to binary string.

 (b | base64_encode) [string] — Convert binary string to base64 string.

 base64_decode [string] — Convert base64 string to binary string.

 pe_meta [filename] — Extract metadata from a PE file.

 (u | url_sig) [string] — Generate URL scanner signatures.

 (s | scan) [name of the file or directory] — Scan a file or directory.

 (s | scan) [name of the file or directory] --xx
 — Scan a file or directory with an additional option.
   --wc — Scan without caching the results.
   --sf — Print the variables set by the switch file.

 i [name of the file or directory] — Get information about files.

 c — Print this command list.
