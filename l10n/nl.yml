cli_ln2: |
 Dank u voor het gebruiken van phpMussel, een PHP-script ontwikkeld om
 trojans, virussen, malware en andere bedreigingen te ontworpen, binnen
 bestanden geüpload naar uw systeem waar het script is haakte, gebaseerd op
 de signatures van ClamAV en anderen.
                                     ~ ~ ~
 PHPMUSSEL COPYRIGHT 2013 en verder GNU/GPL V.2 van Caleb M (Maikuolan).
                                     ~ ~ ~
cli_ln3: |
 Momenteel phpMussel is in CLI-modus (commandlijn interface). Om scannen
 een bestand of map, typ "scan", gevolgd door de naam van het bestand of de
 map die u wilt phpMussel te scannen en druk op Enter; Typ "c" en druk op
 Enter voor een lijst op CLI-modus commando's; Typ "q" en druk op Enter om
 te stoppen.
%s is not a file or directory: "%s is geen bestand of map."
Entropy: "Entropie:"
Filename: "Bestandsnaam:"
I don_t understand that command, sorry: "Ik begrijp niet dat bevel, sorry."
In progress: "Aan de gang"
Invalid URL: "Ongeldige URL!"
Last modified: "Laatst gewijzigd:"
Not a valid PE file: "Geen geldig PE-bestand!"
PE Sections: "PE Secties:"
Specified algorithm isn_t supported: "Opgegeven algoritme wordt niet ondersteund."
YOUR SIGNATURE NAME: "UW-SIGNATURE-NAAM"
cli_commands: |
 q | quit | exit — Verlaten CLI.

 hash_file:[algo] [bestandsnaam] — Genereer hash signatures van bestanden.

 hash:[algo] [string] — Genereer hash signature van string.
 Voorbeeld: >> hash:crc32b Hello World
            4a17b156:11:UW-SIGNATURE-NAAM

 a | algo — Maak een lijst van alle ondersteunde algoritmen.

 (x | hex_encode) [string]
 — Converteren van binaire string naar hexadecimaal.
 Voorbeeld: >> hex_encode Hello World
            48656c6c6f20576f726c64

 hex_decode [string]
 — Converteren van hexadecimaal naar binaire string.

 (b | base64_encode) [string]
 — Converteren van binaire string naar base64 string.

 base64_decode [string]
 — Converteren van base64 string naar binaire string.

 pe_meta [bestandsnaam] — Haal metagegevens uit een PE-bestand.

 (u | url_sig) [string] — Genereren URL-scanner signatures.

 (s | scan) [bestandsnaam of mapnaam] — Scannen bestand of map.

 (s | scan) [bestandsnaam of mapnaam] --xx
 — Scannen bestand of map met een extra optie.
   --wc — Scannen zonder de resultaten te cachen.
   --sf — Druk de variabelen die door het switchbestand zijn ingesteld.

 i [bestandsnaam of mapnaam] — Informatie over bestanden verkrijgen.

 c — Print dit commando lijst.
