cli_ln2: |
 ขอบคุณที่ใช้ phpMussel สคริปต์ PHP ออกแบบมาเพื่อตรวจจับโทรจัน ไวรัส,
 มัลแวร์ และภัยคุกคามอื่นภายในไฟล์ที่อัปโหลดไปยังระบบของคุณ,
 ที่ใดก็ตามที่สคริปต์ถูกตะขอ ขึ้นอยู่กับลายเซ็นของ ClamAV และคนอื่น ๆ.
                                     ~ ~ ~
 PHPMUSSEL ลิขสิทธิ์ 2013 และอื่น GNU/GPLv2 โดย Caleb M (Maikuolan).
                                     ~ ~ ~
cli_ln3: |
 กำลังรัน phpMussel ในโหมด CLI (ส่วนติดต่อบรรทัดคำสั่ง).
 เพื่อสแกนไฟล์หรือไดเรกทอรี ป้อน scan ตามด้วยชื่อของไฟล์หรือไดเรกทอรีที่
 คุณต้องการให้ phpMussel สแกนและกด Enter; ป้อน c และกด Enter
 สำหรับรายการคำสั่ง ในโหมด CLI; ป้อน q และกด Enter ที่จะเลิก.
%s is not a file or directory: "%s ไม่ใช่ไฟล์หรือไดเรกทอรี."
Entropy: "เอนโทรปี:"
Filename: "ชื่อไฟล์:"
I don_t understand that command, sorry: "ฉันไม่เข้าใจคำสั่งนั้นขอโทษ."
In progress: "กำลังดำเนินการ"
Invalid URL: "URL ไม่ถูกต้อง!"
Last modified: "ปรับปรุงล่าสุด:"
Not a valid PE file: "ไม่ใช่ไฟล์ PE ที่ถูกต้อง!"
PE Sections: "ส่วน PE:"
Specified algorithm isn_t supported: "ไม่รองรับอัลกอริทึมที่ระบุ."
YOUR SIGNATURE NAME: "ชื่อลายเซ็น"
cli_commands: |
 q | quit | exit — ออกจาก CLI.

 hash_file:[ขั้นตอนวิธี] [ชื่อไฟล์] — สร้างลายเซ็นแฮจากไฟล์.

 hash:[ขั้นตอนวิธี] [สตริง] — สร้างลายเซ็นแฮจากสตริง.
 ตัวอย่าง: >> hash:crc32b Hello World
         4a17b156:11:ชื่อลายเซ็น

 a | algo — แสดงรายการอัลกอริทึมที่รองรับทั้งหมด.

 hex_encode [สตริง] — แปลงสตริงไบนารีเป็นเลขฐานสิบหก.
 ตัวอย่าง: >> hex_encode Hello World
         48656c6c6f20576f726c64

 hex_decode [สตริง] — แปลงเลขฐานสิบหกเป็นสตริงไบนารี.

 (b | base64_encode) [สตริง] — แปลงสตริงไบนารีเป็นสตริง base64.

 base64_decode [สตริง] — แปลงสตริง base64 เป็นสตริงไบนารี.

 pe_meta [ชื่อไฟล์] — ดึงข้อมูลเมตาดาต้าจากไฟล์ PE.

 (u | url_sig) [สตริง] — สร้างลายเซ็น URL สแกนเนอร์.

 (s | scan) [ชื่อไฟล์] — สแกนไฟล์หรือไดเรกทอรี.

 (s | scan) [ชื่อไฟล์] --xx
 — สแกนไฟล์หรือไดเรกทอรีด้วยตัวเลือกเพิ่มเติม.
   --wc — สแกนโดยไม่ต้องแคชผลลัพธ์.
   --sf — พิมพ์ค่าตัวแปรที่ตั้งค่าโดยไฟล์สวิตช์.

 i [ชื่อไฟล์] — รับข้อมูลเกี่ยวกับไฟล์.

 c — พิมพ์รายการคำสั่งนี้.
