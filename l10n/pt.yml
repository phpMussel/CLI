cli_ln2: |
 Obrigado por usando phpMussel, um PHP script projetado para detectar
 trojans, vírus, malware e outras ameaças dentro dos arquivos enviados para
 o seu sistema onde quer que o script é enganchado, baseado no assinaturas
 do ClamAV e outros.
                                     ~ ~ ~
 PHPMUSSEL COPYRIGHT 2013 e além GNU/GPL V.2 através do Caleb M
 (Maikuolan).
                                     ~ ~ ~
cli_ln3: |
 Correntemente execução phpMussel em CLI modo (comando linha interface).
 Para analisar um arquivo ou diretório, digitá "scan", seguido pelo nome do
 arquivo ou diretório que você deseja phpMussel para analisar e pressione
 Enter; Digitá "c" e pressione Enter por uma lista de CLI modo comandos;
 Digitá "q" e pressione Enter para sair.
%s is not a file or directory: "%s não é um arquivo ou diretório."
Entropy: "Entropia:"
Filename: "Nome do arquivo:"
I don_t understand that command, sorry: "Eu não entendo esse comando, desculpe."
In progress: "Em processo"
Invalid URL: "URL inválido!"
Last modified: "Última modificação:"
Not a valid PE file: "Não é um válido PE arquivo!"
PE Sections: {"pt-BR": "PE Seções:", "pt-PT": "PE Secções:"}
Specified algorithm isn_t supported: "Algoritmo especificado não é suportado."
YOUR SIGNATURE NAME: "O-NOME-DA-SUA-ASSINATURA"
cli_commands: |
 q | quit | exit — Deixar CLI.

 hash_file:[algo] [nome do arquivo] — Gerar hash assinaturas de arquivos.

 hash:[algo] [string] — Gerar hash assinatura de string.
 Exemplo: >> hash:crc32b Hello World
          4a17b156:11:O-NOME-DA-SUA-ASSINATURA

 a | algo — Listar todos os algoritmos suportados.

 (x | hex_encode) [string] — Converter binária string para hexadecimal.
 Exemplo: >> hex_encode Hello World
          48656c6c6f20576f726c64

 hex_decode [string] — Converter hexadecimal para binária string.

 (b | base64_encode) [string]
 — Converter binária string para base64 string.

 base64_decode [string] — Converter base64 string para binária string.

 pe_meta [nome do arquivo] — Extrair metadados de um arquivo PE.

 (u | url_sig) [string] — Gerar assinaturas do scanner de URL.

 (s | scan) [nome do arquivo ou diretório]
 — Verificar um arquivo ou diretório.

 (s | scan) [nome do arquivo ou diretório] --xx
 — Verificar um arquivo ou diretório com uma opção adicional.
   --wc — Verificar sem armazenar os resultados em cache.
   --sf — Imprima as variáveis definidas pelo arquivo switch.

 i [nome do arquivo ou diretório] — Obtenha informações sobre arquivos.

 c — Imprimir esta lista de comandos.
